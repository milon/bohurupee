<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{providerLabel .Provider}} — Bohurupee</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>{{css}}</style>
</head>
<body>
  <main class="sheet">
    <header>
      <div class="mark mark-sm">{{logo}}</div>
      <p class="stamp">DEV ONLY</p>
      <p class="kicker">Sign in with</p>
      <h1 class="provider">{{providerLabel .Provider}}</h1>
      <p class="lede">Pick a persona. This is a local fake identity provider.</p>
    </header>
    <p class="choose">Continue as…</p>
    <div class="personas">
      {{range .Personas}}
      <a class="persona{{if eq .ID $.LastID}} last{{end}}" href="{{continueURL $.Query .ID}}">
        <strong>{{.Name}}</strong>
        <div class="meta">{{.ID}}{{if .Email}} · {{.Email}}{{end}}</div>
      </a>
      {{end}}
    </div>
  </main>
</body>
</html>
