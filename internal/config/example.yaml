port: 4190
bind: 127.0.0.1
pkce: optional
idToken: openid
openClient: true
# refreshTokens: true   # opt-in; off by default

personas:
  - id: alice
    email: alice@example.com
    name: Alice Admin
    nickname: alice
    claims:
      role: admin
  - id: bob
    email: bob@example.com
    name: Bob User
    email_verified: false
    claims:
      role: user
  - id: carol
    email: carol@example.com
    name: Carol Reviewer
    nickname: carol
    avatar: ""
    response:
      picture: ""

providerProfiles:
  github:
    responseTemplate: github
  google:
    responseTemplate: google
  facebook:
    responseTemplate: facebook
    endpoints:
      userinfo: /me
  twitch:
    responseTemplate: twitch
  apple:
    responseTemplate: apple
    protocol:
      response_mode: form_post
      id_token: true
  jumpcloud:
    responseTemplate: jumpcloud
  gitlab:
    responseTemplate: gitlab
  bitbucket:
    responseTemplate: bitbucket
  slack:
    responseTemplate: slack
  linkedin:
    responseTemplate: linkedin
  discord:
    responseTemplate: discord
  microsoft:
    responseTemplate: microsoft

