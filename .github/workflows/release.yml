name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build snapshot binaries
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean

      - name: Run examples against the release build
        shell: bash
        run: |
          set -euo pipefail
          bin="$(find dist -type f -name bohurupee -path '*linux_amd64*' | head -1)"
          if [[ -z "${bin}" ]]; then
            echo "linux/amd64 binary not found under dist/" >&2
            find dist -type f >&2
            exit 1
          fi
          "${bin}" --version
          "${bin}" --config ./bohurupee.example.yaml > /tmp/bohurupee.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/bohurupee.log' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4190/ >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Bohurupee exited before becoming ready" >&2
              exit 1
            fi
            sleep 0.2
          done

          ./examples/curl/run-all.sh
          python3 ./examples/oidc-client/client.py
          kill "$server_pid"
          wait "$server_pid" || true
          trap - EXIT

      - name: Publish release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Homebrew cask
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_KEY}" ]]; then
            echo "HOMEBREW_TAP_DEPLOY_KEY is not set; the tap was not updated." >&2
            exit 1
          fi
          checksums="dist/checksums.txt"
          if [[ ! -f "${checksums}" ]]; then
            echo "checksums were not written at ${checksums}" >&2
            find dist -type f >&2
            exit 1
          fi
          cask="dist/homebrew/Casks/bohurupee.rb"
          bash ./scripts/render-homebrew-cask.sh \
            --version "${GITHUB_REF_NAME}" \
            --checksums "${checksums}" \
            --output "${cask}"
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_KEY}" > "${HOME}/.ssh/homebrew_tap"
          chmod 600 "${HOME}/.ssh/homebrew_tap"
          ssh-keyscan -t ed25519 github.com >> "${HOME}/.ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh -i ${HOME}/.ssh/homebrew_tap -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:milon/homebrew-bohurupee.git /tmp/homebrew-tap
          install -d /tmp/homebrew-tap/Casks
          cp "${cask}" /tmp/homebrew-tap/Casks/bohurupee.rb
          git -C /tmp/homebrew-tap add Casks/bohurupee.rb
          if git -C /tmp/homebrew-tap diff --cached --quiet; then
            echo "Cask already matches this release."
            exit 0
          fi
          git -C /tmp/homebrew-tap \
            -c user.name=milon \
            -c user.email=milon@punt.com \
            commit -m "Point the cask at the ${GITHUB_REF_NAME} release."
          git -C /tmp/homebrew-tap push origin HEAD:main
