name: Docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: dom, gd, mbstring, zip, zlib
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Chromium for Mermaid
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Install mermaid-cli
        run: npm install --global @mermaid-js/mermaid-cli

      - name: Download Papyrus PHAR
        env:
          PAPYRUS_VERSION: "1.5.0"
        run: |
          curl -fsSL -o papyrus.phar \
            "https://github.com/milon/papyrus/releases/download/v${PAPYRUS_VERSION}/papyrus.phar"
          chmod +x papyrus.phar
          php papyrus.phar --version

      - name: Build documentation site
        env:
          PAPYRUS_BIN: php ${{ github.workspace }}/papyrus.phar
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          if [[ -z "${PUPPETEER_EXECUTABLE_PATH:-}" ]]; then
            for candidate in google-chrome chrome chromium chromium-browser; do
              if command -v "$candidate" >/dev/null 2>&1; then
                export PUPPETEER_EXECUTABLE_PATH="$(command -v "$candidate")"
                break
              fi
            done
          fi
          echo "Using Chrome at: ${PUPPETEER_EXECUTABLE_PATH:-not set}"
          docs/bin/build-site
          test -f docs/export/bohurupee-site/index.html
          test -f docs/export/bohurupee-site/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/export/bohurupee-site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
