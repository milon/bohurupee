# Publishes darwin/linux/windows binaries and a multi-arch scratch image.
version: 2

project_name: bohurupee

builds:
  - id: bohurupee
    main: ./cmd/bohurupee
    binary: bohurupee
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s
      - -w
      - -B=gobuildid
      - -X github.com/milon/bohurupee/internal/version.Version={{ .Version }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - src: LICENSE
      - src: README.md
      - src: bohurupee.example.yaml

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc

dockers_v2:
  - ids:
      - bohurupee
    dockerfile: Dockerfile
    images:
      - ghcr.io/milon/bohurupee
    tags:
      - "{{ .Tag }}"
      - "v{{ .Major }}.{{ .Minor }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: false
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "Local fake identity provider for OAuth and OIDC development. DEV ONLY."
      org.opencontainers.image.source: "https://github.com/milon/bohurupee"
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"

# GoReleaser still emits a cask under dist/homebrew/Casks, but it uses nested
# on_macos/on_linux blocks. The release workflow overwrites that file with
# scripts/render-homebrew-cask.sh (Homebrew 7 arch/os/sha256/postflight_steps).
# Do not reintroduce ids: here — that broke archive binding on v0.2.0.
homebrew_casks:
  - name: bohurupee
    repository:
      owner: milon
      name: homebrew-bohurupee
    skip_upload: "true"
    homepage: "https://github.com/milon/bohurupee"
    description: "Local fake identity provider for OAuth and OIDC development. DEV ONLY"
    binaries:
      - bohurupee
    caveats: "Bohurupee is a local fake identity provider. DEV ONLY. It listens on 127.0.0.1:4190."

release:
  github:
    owner: milon
    name: bohurupee
