# Publishes darwin/linux/windows binaries and a multi-arch scratch image.
version: 2

project_name: bohurupee

builds:
  - id: bohurupee
    main: ./cmd/bohurupee
    binary: bohurupee
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s
      - -w
      - -B=gobuildid
      - -X github.com/milon/bohurupee/internal/version.Version={{ .Version }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - src: LICENSE
      - src: README.md
      - src: bohurupee.example.yaml

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc

dockers_v2:
  - ids:
      - bohurupee
    dockerfile: Dockerfile
    images:
      - ghcr.io/milon/bohurupee
    tags:
      - "{{ .Tag }}"
      - "v{{ .Major }}.{{ .Minor }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: false
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "Local fake identity provider for OAuth and OIDC development. DEV ONLY."
      org.opencontainers.image.source: "https://github.com/milon/bohurupee"
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"

# Rendered under dist/homebrew/Casks. The release workflow pushes that file
# to github.com/milon/homebrew-bohurupee with a deploy key.
homebrew_casks:
  - name: bohurupee
    ids:
      - bohurupee
    repository:
      owner: milon
      name: homebrew-bohurupee
    skip_upload: "true"
    homepage: "https://github.com/milon/bohurupee"
    description: "Local fake identity provider for OAuth and OIDC development. DEV ONLY."
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/bohurupee"]
          end
    caveats: "Bohurupee is a local fake identity provider. DEV ONLY. It listens on 127.0.0.1:4190."

release:
  github:
    owner: milon
    name: bohurupee
