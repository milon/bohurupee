# Stub for later release (M7). Do not publish from this file yet.
version: 2

project_name: bohurupee

builds:
  - id: bohurupee
    main: ./cmd/bohurupee
    binary: bohurupee
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
